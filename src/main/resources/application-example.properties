spring.datasource.url= jdbc:mysql://localhost:3306/your_database_name?createDatabaseIfNotExist=true
spring.datasource.username= your_username
spring.datasource.password= your_password
spring.datasource.driver-class-name= com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto= update
spring.jpa.show-sql= true
spring.jpa.properties.hibernate.format_sql= true
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQLDialect

server.port= server_port
server.servlet.context-path= path

logging.level.root= INFO
logging.level.edu.devstack= DEBUG
logging.file.name= app.log

app.jwt.secret= your_jwt_secret
app.jwt.access-token-expiry-ms= expiry_time_ms

# AWS S3 (vehicle images)
# Leave access-key / secret-key blank to fall back to the default AWS credentials
# provider chain (env vars, ~/.aws/credentials, instance profile, etc.)
aws.s3.region= region (Ex: ap-south-1)
aws.s3.bucket-name= bucket_name (Ex: demo-system)
aws.s3.access-key= AWS_access_key
aws.s3.secret-key= AWS_secret_key

# Only needed for S3-compatible services like LocalStack/MinIO. Leave blank for real AWS.
aws.s3.endpoint=

# Base URL used to build public image URLs, e.g. https://your_bucket_name.s3.your_region.amazonaws.com
aws.s3.public-url-base= https://your_bucket_name.s3.your_region.amazonaws.com
aws.s3.max-file-size-mb= file_size (Ex: 5)